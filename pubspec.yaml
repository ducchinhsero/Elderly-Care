name: elder_health_monitor
description: "Ứng dụng giám sát sức khỏe người cao tuổi theo thời gian thực"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9

  # MQTT
  mqtt_client: ^10.2.1

  # Charts
  fl_chart: ^0.66.2

  # HTTP client
  dio: ^5.4.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Firebase
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.15

  # Navigation
  go_router: ^12.1.3

  # Internationalization
  intl: ^0.19.0

  # Permissions
  permission_handler: ^11.3.0

  # Utils
  cupertino_icons: ^1.0.6
  json_annotation: ^4.8.1
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  vibration: ^1.8.4
  audioplayers: ^5.2.1
  share_plus: ^10.0.0
  url_launcher: ^6.2.2
  path_provider: ^2.1.5
  uuid: ^4.3.3
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  pdf: ^3.12.0
  printing: ^5.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.13
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/sounds/
